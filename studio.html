<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Notes</title>
    <link rel="icon" href="{{ url_for('static', filename='icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .notes-modal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(15, 23, 42, .75)
        }

        .notes-modal[hidden] {
            display: none !important
        }

        .notes-dialog {
            width: min(900px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: #fff;
            color: #1f2937;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .25)
        }

        .notes-toolbar {
            position: sticky;
            top: -24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 0;
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 20px;
            z-index: 2
        }

        .notes-toolbar h2 {
            margin: 0;
            font-size: 1.5rem;
            color: #1e3a8a
        }

        #closeNotesModal {
            border: 0;
            border-radius: 8px;
            padding: 10px 16px;
            background: #1e3a8a;
            color: #fff;
            cursor: pointer;
            font-weight: 600
        }

        #closeNotesModal:hover {
            background: #1d4ed8
        }

        .markdown-content {
            max-width: 78ch;
            margin: auto;
            font-size: 1rem;
            line-height: 1.8;
            overflow-wrap: anywhere
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3,
        .markdown-content h4 {
            color: #1e3a8a;
            line-height: 1.35;
            margin: 1.5em 0 .6em
        }

        .markdown-content h1 {
            font-size: 1.9rem;
            border-bottom: 2px solid #dbeafe;
            padding-bottom: 10px
        }

        .markdown-content h2 {
            font-size: 1.5rem;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 6px
        }

        .markdown-content h3 {
            font-size: 1.2rem
        }

        .markdown-content p {
            margin: .8rem 0
        }

        .markdown-content strong {
            font-weight: 800;
            color: #172554
        }

        .markdown-content ul,
        .markdown-content ol {
            padding-left: 28px;
            margin: 12px 0
        }

        .markdown-content li {
            margin: 6px 0;
            padding-left: 3px
        }

        .markdown-content blockquote {
            margin: 16px 0;
            padding: 12px 16px;
            border-left: 4px solid #3b82f6;
            background: #eff6ff
        }

        .markdown-content pre {
            overflow-x: auto;
            padding: 16px;
            background: #f3f4f6;
            border-radius: 8px
        }

        .markdown-content code {
            padding: 2px 5px;
            background: #f3f4f6;
            border-radius: 4px;
            font-family: monospace
        }

        .markdown-content pre code {
            padding: 0;
            background: transparent
        }

        .markdown-content hr {
            border: 0;
            border-top: 1px solid #e5e7eb;
            margin: 24px 0
        }

        @media(max-width:600px) {
            .notes-dialog {
                padding: 16px;
                max-height: 94vh
            }

            .notes-toolbar {
                top: -16px
            }

            .notes-toolbar h2 {
                font-size: 1.2rem
            }

            .markdown-content h1 {
                font-size: 1.55rem
            }

            .markdown-content h2 {
                font-size: 1.3rem
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">Study Notes AI</div>
        <ul class="nav-links">
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a class="active" href="{{ url_for('studio') }}">Studio</a></li>
            <li><a href="{{ url_for('library') }}">Library</a></li>
        </ul>
        <a href="{{ url_for('studio') }}" class="design-button">Generate Notes</a>
    </nav>
    <main class="container form-page">
        <div class="form-card">
            <h1>Study Notes AI</h1>
            <p>Type a prompt and our AI will generate notes specifically for you.</p>
            <label for="title">Note title</label>
            <input type="text" id="title" placeholder="e.g Python Programming">
            <label for="topics">Topics to cover</label>
            <div class="topic-input-row">
                <input type="text" id="topics" placeholder="e.g Variables">
                <button type="button" id="addTopicButton" class="secondary-button">Add Topic</button>
            </div>
            <div id="topiclist" class="topic-list"></div>
            <label for="notetype">Notes type</label>
            <select id="notetype">
                <option>Detailed Notes</option>
                <option>Exam Tips and Quizzes</option>
                <option>Essay Format</option>
                <option>Beginner Friendly</option>
                <option>Quick Revision</option>
            </select>
            <label for="pages">Number of pages</label>
            <input type="number" id="pages" value="5" min="1" max="20">
            <label for="grade">Grade</label>
            <input type="number" id="grade" placeholder="Enter grade" min="1" max="12">
            <div class="checkbox-grid">
                <label class="checkbox-item"><input type="checkbox" id="examples" checked> Include examples</label>
                <label class="checkbox-item"><input type="checkbox" id="exercises" checked> Include exercises</label>
                <label class="checkbox-item"><input type="checkbox" id="summary" checked> Include summary</label>
            </div>
            <button type="button" id="generateButton" class="generate-button">Generate Notes</button>
            <p id="loading" class="loading-message" role="status" aria-live="polite"></p>
        </div>
    </main>
    <div id="notesModal" class="notes-modal" hidden>
        <section class="notes-dialog" role="dialog" aria-modal="true" aria-labelledby="generatedTitle">
            <div class="notes-toolbar">
                <h2 id="generatedTitle">Your Study Notes</h2>
                <button type="button" id="closeNotesModal">Close</button>
            </div>
            <article id="generatedNotes" class="markdown-content"></article>
        </section>
    </div>
    <footer>
        © ALL RIGHTS RESERVED, Created by Ijlal
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
